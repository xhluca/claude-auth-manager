[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "claude-auth-manager"
version = "0.0.6"
description = "Switch Claude subscriptions and API-provider keys from Claude Code"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "xhluca" }]
keywords = ["claude-code", "authentication", "openrouter", "gemini", "coding-agent"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: User Interfaces",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/xhluca/claude-auth-manager"
Repository = "https://github.com/xhluca/claude-auth-manager"
Issues = "https://github.com/xhluca/claude-auth-manager/issues"

[project.scripts]
claude-auth-manager = "claude_auth_manager.cli:main"
cam = "claude_auth_manager.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_auth_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
